<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JoaGOLFStudio | インドアゴルフスタジオ</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <div id="header-placeholder"></div>

    <main>
        <section class="kv">
            <div class="kv-inner fade-in">
                <h2 class="kv-copy">もっと、ゴルフを日常に。</h2>
                <p>初心者からプロ志向まで、理想のインドアスタジオ</p>
                <div class="kv-action">
                    <a href="contact/index.html" class="btn">無料体験レッスン予約</a>
                </div>
            </div>
        </section>

        <section class="section-padding container fade-in">
            <div class="section-header">
                <h2>JoaGOLFStudioとは？</h2>
            </div>
            <div class="concept-brief text-center">
                <p>最新のシミュレーターと快適な空間で、あなたのゴルフライフをサポートします。</p>
                <div class="center-btn" style="margin-top: 30px;">
                    <a href="concept/index.html" class="btn">特徴・選ばれる理由</a>
                </div>
            </div>
        </section>

        <section class="section-padding bg-light fade-in">
            <div class="container text-center">
                <div class="section-header">
                    <h2>STORES</h2>
                    <p>関西・関東エリアに合計6店舗を展開中！</p>
                </div>
                <p style="margin-bottom: 30px;">お近くの店舗はこちらからご確認いただけます。</p>
                <div class="center-btn">
                    <a href="store/index.html" class="btn">店舗一覧を見る</a>
                </div>
            </div>
        </section>

        <section class="section-padding container fade-in text-center">
            <div class="section-header">
                <h2>VOICE</h2>
            </div>
            <div class="center-btn">
                <a href="voice/index.html" class="btn">会員様の声を見る</a>
            </div>
        </section>

        <section class="section-padding container grid-3 fade-in">
            <div class="link-card">
                <h3>FAQ</h3>
                <a href="faq/index.html" class="btn-outline">よくある質問</a>
            </div>
            <div class="link-card">
                <h3>RECRUIT</h3>
                <a href="recruit/index.html" class="btn-outline">採用情報</a>
            </div>
            <div class="link-card">
                <h3>CONTACT</h3>
                <a href="contact/index.html" class="btn-outline">お問い合わせ</a>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script src="assets/js/main.js"></script>
</body>

</html>
