<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEWS | JoaGOLFStudio</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .news-list {
            max-width: 900px;
            margin: 0 auto;
        }

        .news-item {
            display: flex;
            gap: 30px;
            padding: 30px 0;
            border-bottom: 1px solid #eee;
            text-decoration: none;
            color: inherit;
            transition: var(--transition);
        }

        .news-item:hover {
            opacity: 0.6;
            background: #fafafa;
        }

        .news-meta {
            flex-shrink: 0;
            width: 120px;
        }

        .news-date {
            display: block;
            font-weight: 700;
            color: #999;
            font-size: 0.9rem;
        }

        .news-category {
            display: inline-block;
            margin-top: 5px;
            padding: 2px 10px;
            background: var(--primary-color);
            color: var(--white);
            font-size: 0.7rem;
            border-radius: 3px;
        }

        .news-title {
            font-size: 1.1rem;
            font-weight: 700;
            line-height: 1.6;
        }

        @media (max-width: 768px) {
            .news-item {
                flex-direction: column;
                gap: 10px;
            }

            .news-meta {
                width: 100%;
                display: flex;
                align-items: center;
                gap: 15px;
            }
        }
    </style>
</head>

<body>
    <div id="header-placeholder"></div>

    <main>
        <section class="kv" style="height: 300px;">
            <div class="kv-inner fade-in">
                <h2 class="kv-copy" style="font-size: 3rem;">NEWS</h2>
                <p>お知らせ一覧</p>
            </div>
        </section>

        <section class="section-padding container">
            <div class="news-list">
                <a href="01/index.html" class="news-item fade-in">
                    <div class="news-meta">
                        <span class="news-date">2026.04.26</span>
                        <span class="news-category">重要</span>
                    </div>
                    <h3 class="news-title">JoaGOLFStudio 公式サイトをリニューアルオープンいたしました</h3>
                </a>

                <a href="02/index.html" class="news-item fade-in">
                    <div class="news-meta">
                        <span class="news-date">2026.04.15</span>
                        <span class="news-category">キャンペーン</span>
                    </div>
                    <h3 class="news-title">【期間限定】春の入会金無料キャンペーン実施中！</h3>
                </a>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>
    <script src="../assets/js/main.js"></script>
</body>

</html>
