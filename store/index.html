<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>店舗一覧 | JoaGOLFStudio</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

    <div id="header-placeholder"></div>

    <main>
        <section class="kv" style="height: 300px;">
            <div class="kv-inner fade-in">
                <h2 class="kv-copy" style="font-size: 3rem;">STORES</h2>
                <p>店舗一覧</p>
            </div>
        </section>

        <style>
            /* カードのサイズを統一するための専用CSS（すでにある場合は上書きしてください） */
            .store-list-container {
                max-width: 1100px;
                margin: 0 auto;
                padding: 0 20px;
            }
        
            .grid-uniform {
                display: grid;
                /* 常に3カラムの枠を固定で作ることで、カード1枚あたりの幅を統一します */
                grid-template-columns: repeat(3, 1fr);
                gap: 30px;
                align-items: stretch;
            }
        
            .store-card-uniform {
                display: flex;
                flex-direction: column;
                background: #fff;
                padding: 30px 20px;
                border-radius: 20px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
                text-align: center;
                height: 100%;
                box-sizing: border-box;
            }
        
            .store-card-uniform h3 {
                color: var(--primary-color);
                margin: 10px 0 15px;
                font-size: 1.25rem;
            }
        
            .store-address-text {
                flex-grow: 1;
                /* 住所の長さに関わらず、ボタンの位置を一番下に揃えます */
                font-size: 0.85rem;
                color: #666;
                margin-bottom: 20px;
                line-height: 1.6;
            }
        
            .store-card-uniform .btn {
                width: 100%;
                display: block;
                padding: 12px 0;
            }
        
            /* タブレット・スマホ用のレスポンシブ設定 */
            @media (max-width: 992px) {
                .grid-uniform {
                    grid-template-columns: repeat(2, 1fr);
                }
            }
        
            @media (max-width: 600px) {
                .grid-uniform {
                    grid-template-columns: 1fr;
                }
            }
        </style>
        
        <section class="section-padding fade-in">
            <div class="store-list-container">
                <div class="section-header">
                    <h2>関西エリア</h2>
                </div>
                <div class="grid-uniform">
                    <article class="store-card-uniform">
                        <div class="store-img" style="background: #eee; height: 180px; border-radius: 10px;"></div>
                        <h3>神戸店</h3>
                        <p class="store-address-text">〒650-0021<br>兵庫県神戸市中央区三宮町1-1-1</p>
                        <a href="kobe/index.html" class="btn">詳細を見る</a>
                    </article>
        
                    <article class="store-card-uniform">
                        <div class="store-img" style="background: #eee; height: 180px; border-radius: 10px;"></div>
                        <h3>箕面店</h3>
                        <p class="store-address-text">〒562-0001<br>大阪府箕面市箕面1-1-1</p>
                        <a href="minoh/index.html" class="btn">詳細を見る</a>
                    </article>
                </div>
            </div>
        </section>
        
        <section class="section-padding bg-light fade-in">
            <div class="store-list-container">
                <div class="section-header">
                    <h2>関東エリア</h2>
                </div>
                <div class="grid-uniform">
                    <article class="store-card-uniform">
                        <div class="store-img" style="background: #eee; height: 180px; border-radius: 10px;"></div>
                        <h3>麹町店</h3>
                        <p class="store-address-text">〒102-0083<br>東京都千代田区麹町3-5-2</p>
                        <a href="kojimachi/index.html" class="btn">詳細を見る</a>
                    </article>
        
                    <article class="store-card-uniform">
                        <div class="store-img" style="background: #eee; height: 180px; border-radius: 10px;"></div>
                        <h3>西新宿店</h3>
                        <p class="store-address-text">〒160-0023<br>東京都新宿区西新宿1-25-1</p>
                        <a href="nishi-shinjuku/index.html" class="btn">詳細を見る</a>
                    </article>
        
                    <article class="store-card-uniform">
                        <div class="store-img" style="background: #eee; height: 180px; border-radius: 10px;"></div>
                        <h3>千駄ヶ谷店</h3>
                        <p class="store-address-text">〒151-0051<br>東京都渋谷区千駄ヶ谷1-15-10</p>
                        <a href="sendagaya/index.html" class="btn">詳細を見る</a>
                    </article>
        
                    <article class="store-card-uniform">
                        <div class="store-img" style="background: #eee; height: 180px; border-radius: 10px;"></div>
                        <h3>赤坂店</h3>
                        <p class="store-address-text">〒107-0052<br>東京都港区赤坂3-21-15</p>
                        <a href="akasaka/index.html" class="btn">詳細を見る</a>
                    </article>
                </div>
            </div>
        </section>
        
    </main>

    <div id="footer-placeholder"></div>

    <script src="../assets/js/main.js"></script>
</body>

</html>
